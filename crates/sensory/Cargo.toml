[package]
name = "benshu-sensory"
version.workspace = true
edition.workspace = true
description = "Sensory Hub for BenShu - Native Vision and Audio Perception"

[dependencies]
# Basic
tokio = { workspace = true, features = ["full"] }
anyhow = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
benshu-infra = { workspace = true }
parking_lot = "0.12"
uuid = { workspace = true, features = ["v4"] }
dirs = "6.0"
dashmap = "6.1"

# Image & Audio Processing
image = "0.25"
imageproc = "0.24"
hound = "3.5" # WAV handling
rubato = "0.14"
reqwest = { version = "0.11", features = ["json", "multipart"] }
chrono = { workspace = true }
regex = "1.10"

# AI Backends
benshu-inference = { path = "../inference" }
benshu-engram = { path = "../engram" }
benshu-runtimes = { path = "../runtimes" }
candle-core = "0.8"
candle-nn = "0.8"
candle-transformers = "0.8"
byteorder = "1.5"
tokenizers = "0.20"

[lints]
workspace = true
