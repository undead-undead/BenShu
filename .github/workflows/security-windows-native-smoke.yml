name: Security Windows Native Smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows-security-smoke:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        shell: pwsh
        run: |
          choco install protoc --no-progress -y
          protoc --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run benshu-security Windows native smoke
        shell: bash
        run: cargo test -p benshu-security --lib
